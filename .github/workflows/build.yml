# winemiku 를 빌드해서 winemiku.cachix.org 에 올린다.
# 사용자가 nix run 할 때 패치된 모듈·DXVK 를 직접 컴파일하지 않고 캐시에서 받게 하려는 것.
# vanilla wine 등 cache.nixos.org 에 있는 경로는 cachix 가 올리지 않는다.
name: build

on:
  push:
    branches: [master]
    paths:
      - flake.nix
      - flake.lock
      - patches/**
      - bin/**
      - scripts/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - patches/**
      - bin/**
      - scripts/**
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: cachix/cachix-action@v16
        with:
          name: winemiku
          # PR(포크)에는 시크릿이 없으므로 받기만 하고 올리지 않는다
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build
        run: |
          nix build --print-build-logs --keep-going \
            .#winemiku .#winemiku-unpatched .#wine-miku-modules
